<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 210" width="210" height="210">
  <!-- Generert av scripts/build-brand-icons.mjs — ikke rediger for hånd. -->
  <style>
    .on-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .on-light { display: none; }
      .on-dark { display: inline; }
    }
  </style>
  <image class="on-light" width="210" height="210" href="data:image/png;base64,"/>
  <image class="on-dark" width="210" height="210" href="data:image/png;base64,"/>
</svg>
