<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 14 14" fill="none">
  <style>
    /*
      Fargen settes her og ikke som fill-attributt: en favicon arver ingen
      farge fra siden, så `currentColor` ville falt tilbake til svart.

      Verdiene er --ev-text i de to temaene, ikke rent svart/hvitt — ikonet
      skal se ut som resten av Tickethalo i fanen.

      Merk: Safari leser ikke prefers-color-scheme i favicon-SVG-er og viser
      alltid lysvarianten. Chrome, Edge og Firefox bytter som forventet.
    */
    :root { color: #2e0c01; }
    @media (prefers-color-scheme: dark) {
      :root { color: #fff4ec; }
    }
  </style>
