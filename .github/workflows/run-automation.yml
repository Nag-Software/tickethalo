name: Run automation

on:
  schedule:
    # 06:00 UTC: tilbudene lander til frokost i norsk tid, ikke midt på natten.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  booking:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily booking automation
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL%/}"
          curl --fail --show-error --silent \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/booking"
